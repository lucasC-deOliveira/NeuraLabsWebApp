# Sobe Postgres + a API NestJS + o frontend (SPA Vite servida por nginx).
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: neuralabs
      POSTGRES_PASSWORD: neuralabs
      POSTGRES_DB: neuralabs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuralabs"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://neuralabs:neuralabs@postgres:5432/neuralabs?schema=public"
      JWT_SECRET: "${JWT_SECRET:-troque-este-segredo}"
      PORT: "3001"
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:-http://localhost:3000}"
      # Limita quantas páginas de PDF a prova lê (0 = todas). Ex.: 2 para testar barato.
      PROVA_MAX_PAGES: "${PROVA_MAX_PAGES:-0}"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      args:
        # build-time: vai pro bundle do browser; usa a porta publicada do backend
        VITE_API_URL: "${VITE_API_URL:-http://localhost:3001/api}"
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancela runs antigos do mesmo branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---- Gates BLOQUEANTES ----------------------------------------------------

  frontend:
    name: Frontend (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit
      - name: Tests (vitest)
        run: npx vitest run

  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Build (nest build)
        run: npm run build
      - name: Tests unit (vitest)
        run: npm test
      - name: Arquitetura — fronteiras hexagonais (dependency-cruiser)
        run: npm run arch:check
      - name: Lint estrito — código novo (src/modules)
        run: npm run lint:strict
      - name: Formatação (prettier)
        run: npm run format:check
      - name: Mutação — domínio (Stryker, break 70)
        run: npm run test:mutation
      - name: Lint baseline legado (report-only)
        continue-on-error: true
        run: npm run lint

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---- Gate NÃO-BLOQUEANTE (relatório) --------------------------------------
  # Lint tem ~345 erros legados. Roda como relatório visível até a limpeza;
  # depois remover o `continue-on-error` para torná-lo bloqueante.

  quality:
    name: Lint + audit (report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: ESLint (report-only)
        run: |
          npx eslint . 2>&1 | tee eslint.txt || true
          echo "### ESLint" >> "$GITHUB_STEP_SUMMARY"
          tail -n 3 eslint.txt >> "$GITHUB_STEP_SUMMARY" || true
      - name: npm audit (report-only)
        run: npm audit --audit-level=high || true

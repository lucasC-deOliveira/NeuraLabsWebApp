# Sobe Postgres + a API NestJS + o frontend (SPA Vite servida por nginx).
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: neuralabs
      POSTGRES_PASSWORD: neuralabs
      POSTGRES_DB: neuralabs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuralabs"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Vetores locais (HuggingFace TEI). Fala o protocolo OpenAI em /v1/embeddings,
  # então o adapter de embeddings do backend não muda — só aponta para cá.
  # Existe porque o provedor de texto (proxy do CLI claude) só faz chat completion.
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    restart: unless-stopped
    command: ["--model-id", "intfloat/multilingual-e5-small"]
    volumes:
      - embeddings-cache:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  # TTS neural local (Piper). Sintetiza a leitura dos flashcards em voz natural,
  # grátis e offline — mesmo espírito do container de embeddings. Vozes pt-BR e
  # en-US embutidas no build (ver piper/Dockerfile). O backend faz o proxy
  # (/api/tts/synthesize) — o browser NÃO fala com o Piper direto. A porta é
  # publicada só em localhost (não exposta na rede) para o dev-loop na máquina:
  # backend via npm aponta PIPER_BASE_URL=http://localhost:5001. Em compose, o
  # backend usa o DNS interno http://piper:5000. Healthcheck bate no /health.
  piper:
    build: ./piper
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PIPER_PORT:-5001}:5000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    # Contexto na raiz (não ./backend): o build precisa de contracts/, que é irmã
    # de backend/. Ver o cabeçalho do backend/Dockerfile.
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://neuralabs:neuralabs@postgres:5432/neuralabs?schema=public"
      # Trocar o modelo invalida os vetores já gravados (dimensão e espaço mudam).
      EMBEDDINGS_BASE_URL: "${EMBEDDINGS_BASE_URL:-http://embeddings:80/v1}"
      EMBEDDINGS_MODEL: "${EMBEDDINGS_MODEL:-intfloat/multilingual-e5-small}"
      JWT_SECRET: "${JWT_SECRET:-troque-este-segredo}"
      PORT: "3001"
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:-http://localhost:3000}"
      # Limita quantas páginas de PDF a prova lê (0 = todas). Ex.: 2 para testar barato.
      PROVA_MAX_PAGES: "${PROVA_MAX_PAGES:-0}"
      # TTS: o backend faz proxy para o container Piper (rede interna do compose).
      PIPER_BASE_URL: "${PIPER_BASE_URL:-http://piper:5000}"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      # started, não healthy: o TEI baixa o modelo no primeiro boot e a API não
      # precisa dele para subir — só as features de vetor esperam.
      embeddings:
        condition: service_started
      # started: o Piper baixa nada em runtime (vozes vêm no build); a API não
      # depende dele para subir — só a leitura em voz alta espera.
      piper:
        condition: service_started

  frontend:
    build:
      context: .
      args:
        # build-time: vai pro bundle do browser; usa a porta publicada do backend
        VITE_API_URL: "${VITE_API_URL:-http://localhost:3001/api}"
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  embeddings-cache:

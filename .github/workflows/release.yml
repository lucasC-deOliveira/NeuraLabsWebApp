name: Release Desktop

# Dispara ao publicar uma tag de versão (ex.: v0.1.0) ou manualmente.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        env:
          # não baixa o binário do Electron aqui; o electron-builder cuida disso
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci

      # thin client: build estático do Vite (dist/). Sem banco nem segredos —
      # os dados vêm do backend via JWT em runtime.
      - name: Build desktop bundle (Vite)
        run: npm run desktop:build

      - name: Build and publish installers
        run: npx electron-builder --publish always
        env:
          # token padrão do Actions cria/atualiza a Release da tag
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

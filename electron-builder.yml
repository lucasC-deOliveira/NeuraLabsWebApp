appId: com.neuralabs.flashcardapp
productName: NeuraLabs Flashcards
copyright: Copyright © 2026 Lucas Oliveira

directories:
  output: dist-electron
  buildResources: build

# Apenas o código do Electron entra no asar; a UI estática (build do Vite) vai
# como recurso desempacotado e é carregada via file:// (HashRouter).
files:
  - electron/**/*
  - package.json
  # o main.js só usa electron + builtins; a UI vai em dist (extraResources).
  # Evita empacotar node_modules redundante no asar.
  - "!node_modules/**/*"

extraResources:
  - from: dist
    to: dist

asar: true
npmRebuild: false

publish:
  provider: github
  owner: lucasC-deOliveira
  repo: NeuraLabsWebApp

win:
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
    - deb
  category: Education
  artifactName: ${productName}-${version}.${ext}

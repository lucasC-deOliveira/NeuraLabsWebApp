name: Release Desktop

# Dispara ao publicar uma tag de versão (ex.: v0.1.0) ou manualmente.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate (engines Linux + Windows)
        run: npx prisma generate

      - name: Build desktop bundle (Next standalone + DB template)
        run: npm run desktop:build
        env:
          DATABASE_URL: "file:./build/app.db"
          # placeholder só para satisfazer o guard de produção durante o build;
          # o secret real é gerado pelo Electron por instalação, em runtime.
          JWT_SECRET: "build-time-placeholder-not-used-at-runtime"

      - name: Build and publish installers
        run: npx electron-builder --publish always
        env:
          # token padrão do Actions cria/atualiza a Release da tag
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
